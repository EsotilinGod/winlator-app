plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.example.rinlivewallpaper'
    compileSdk 35

    defaultConfig {
        applicationId 'com.example.rinlivewallpaper'
        minSdk 23
        targetSdk 35
        versionCode 7
        versionName '1.6'
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = "17" }

    testOptions {
        unitTests.includeAndroidResources = true
        unitTests.all {
            if (project.hasProperty('robolectricRepo')) {
                systemProperty 'robolectric.dependency.repo.url', project.property('robolectricRepo')
            }
        }
    }
    //kotlin { compilerOptions { jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17 } }
}

dependencies {
    // Prueba de captura en la JVM (Robolectric, gráficos nativos).
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.14.1'
}
