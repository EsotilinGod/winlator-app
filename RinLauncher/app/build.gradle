plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.example.rinlauncher'
    compileSdk 35

    defaultConfig {
        applicationId 'com.example.rinlauncher'
        minSdk 26
        targetSdk 35
        versionCode 10
        versionName '2.0'
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = "17" }

    testOptions {
        unitTests.includeAndroidResources = true
        unitTests.all {
            // Opcional: -ProbolectricRepo=<url> para descargar el runtime de Robolectric desde otro espejo.
            if (project.hasProperty('robolectricRepo')) {
                systemProperty 'robolectric.dependency.repo.url', project.property('robolectricRepo')
            }
        }
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.activity:activity-ktx:1.9.3'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'

    // Prueba de captura de pantalla en la JVM (Robolectric, gráficos nativos).
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.14.1'
    testImplementation 'androidx.test:core:1.6.1'
}
