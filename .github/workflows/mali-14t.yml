name: Winlator Mali 14T APK

on:
  push:
    branches: [mali-14t]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mali-14t-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Restore permanent experimental signing key
        env:
          WINLATOR_DEBUG_KEYSTORE_BASE64: ${{ secrets.WINLATOR_DEBUG_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "$WINLATOR_DEBUG_KEYSTORE_BASE64" ]; then
            echo "::error::Configure the repository secret WINLATOR_DEBUG_KEYSTORE_BASE64. Refusing to generate another temporary signing key."
            exit 1
          fi
          python3 - <<'PY'
          import base64, os
          from pathlib import Path
          key_path = Path.home() / ".android" / "debug.keystore"
          key_path.parent.mkdir(parents=True, exist_ok=True)
          key_path.write_bytes(base64.b64decode(os.environ["WINLATOR_DEBUG_KEYSTORE_BASE64"].strip(), validate=True))
          key_path.chmod(0o600)
          PY
          keytool -certreq -alias androiddebugkey -keystore "$HOME/.android/debug.keystore" -storepass android -keypass android -file "$RUNNER_TEMP/signing-check.csr"
          rm -f "$RUNNER_TEMP/signing-check.csr"
      - name: Run Java regression checks
        run: python3 tests/mali-14t/java/run.py app/src/main/java/com/winlator
      - name: Check per-game DLL override merging
        run: |
          javac -d /tmp/dinput8-test app/src/main/java/com/winlator/core/DllOverrides.java tests/dinput8/DllOverridesTest.java
          java -cp /tmp/dinput8-test DllOverridesTest
      - name: Run native regression checks
        run: python3 tests/mali-14t/native/run.py app/src/main/cpp/vortekrenderer
      - name: Check Mali memory and texture cache regressions
        run: python3 tests/mali-memory/run.py app/src/main/cpp/vortekrenderer
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install Android build tools
        run: sdkmanager "platforms;android-35" "build-tools;34.0.0" "ndk;24.0.8215888" "cmake;3.22.1"
      - name: Build debug APK
        run: |
          set -o pipefail
          bash ./gradlew --no-daemon --console=plain :app:assembleDebug 2>&1 | tee build-mali-14t.log
      - name: Prepare downloadable APK
        run: |
          mkdir -p artifacts
          cp app/build/outputs/apk/debug/app-debug.apk artifacts/Winlator-11.2-Mali-14T-experimental.apk
          cd artifacts
          sha256sum Winlator-11.2-Mali-14T-experimental.apk > SHA256SUMS.txt
          printf '%s\n' "Source commit: $GITHUB_SHA" "Experimental memory/cache update; runtime validation on Xiaomi 14T pending." > BUILD.txt
      - name: Record APK signing certificate
        run: |
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose --print-certs artifacts/Winlator-11.2-Mali-14T-experimental.apk > artifacts/SIGNING-CERTIFICATE.txt
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Winlator-Mali-14T-${{ github.run_number }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 14
      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-diagnostics-${{ github.run_number }}
          path: |
            build-mali-14t.log
            app/build/outputs/mapping/debug/
          if-no-files-found: ignore
          retention-days: 7

      - name: Remove signing key from runner
        if: always()
        run: rm -f "$HOME/.android/debug.keystore" "$RUNNER_TEMP/signing-check.csr"
